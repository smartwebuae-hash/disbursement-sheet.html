<script>
function showFatalError(msg){
  var app = document.getElementById('app');
  if(app && !app.dataset.rendered){
    app.innerHTML = '<div style="padding:20px;color:#900;font-family:sans-serif;direction:ltr;text-align:left;">'+
      '<h2 style="color:#b00;">Loading error</h2>'+
      '<p style="font-size:13px;word-break:break-word;">'+ msg +'</p>'+
      '<p style="font-size:12px;color:#555;">Please check your internet connection and reload the page.</p>'+
    '</div>';
  }
}
window.addEventListener('error', function(e){ showFatalError(e.message || 'Unknown error'); });
window.addEventListener('unhandledrejection', function(e){ showFatalError('Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
</script>

<script>
const SUPABASE_URL = 'https://iekotptltmkjmieauhqc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_35u5V1apSr2-DCpjp8ltmg_gIJzhXEN';
let supabase;
try{
  if(!window.supabase) throw new Error('Supabase library object not found on window after script load');
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}catch(err){
  showFatalError('Supabase init failed: ' + (err && err.message ? err.message : err));
  throw err;
}

const SHEET_KEY = 'disbursement_sheet';
const HISTORY_KEY = 'disbursement_sheet_history';
const INVENTORY_KEY = 'inventory_master';
const MAX_HISTORY = 50;

async function settingsGet(key){
  try{
    const { data, error } = await supabase.from('settings').select('value').eq('key', key).maybeSingle();
    if(error || !data) return null;
    return data.value;
  }catch(e){ return null; }
}
async function settingsSet(key, value){
  try{
    await supabase.from('settings').upsert({ key, value });
    return true;
  }catch(e){ return false; }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function isoToDisplay(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
const WEEKDAYS_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function weekdayName(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return WEEKDAYS_AR[d.getDay()];
}
function nowTimeLabel(){
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())} - ${isoToDisplay(todayISO())}`;
}

function emptyItem(){
  return { id: uid(), name:'', unit:'كيلو', requested:0, received:0, remaining:0, storekeeper:'', receiver:'', masterId:null };
}

function seedDefault(){
  const titles = [
    'المقبلات',
    'الذبائح',
    'فوالة',
    'اللحم والدجاج للمطعم',
    'الثلاجة',
    'الحلويات',
    'الأسماك',
    'اللحم للمطبخ',
    'الصالة'
  ];
  return {
    chef: '',
    date: todayISO(),
    sections: titles.map(title => ({ id: uid(), title, items: [] }))
  };
}

let state = { chef:'', date: todayISO(), sections:[], loading:true, message:null, inventory:[] };
let historyOpen = false;
let historyList = null;
let inventoryOpen = false;
let lastSavedSections = [];

async function init(){
  let sheet = await settingsGet(SHEET_KEY);
  if(!sheet){
    sheet = seedDefault();
    await settingsSet(SHEET_KEY, sheet);
  }
  state.chef = sheet.chef || '';
  state.date = sheet.date || todayISO();
  state.sections = sheet.sections || [];
  state.sections.forEach(sec=>{
    (sec.items||[]).forEach(it=>{ if(it.masterId === undefined) it.masterId = null; });
  });
  lastSavedSections = JSON.parse(JSON.stringify(state.sections));

  let inventory = await settingsGet(INVENTORY_KEY);
  if(!Array.isArray(inventory)) inventory = [];
  state.inventory = inventory;

  state.loading = false;
  render();
}

async function saveInventory(){
  await settingsSet(INVENTORY_KEY, state.inventory);
}

function applyInventoryDeltas(){
  const deltaByMasterId = {};
  const oldById = {};
  lastSavedSections.forEach(sec=>{
    (sec.items||[]).forEach(it=>{ oldById[it.id] = it; });
  });
  state.sections.forEach(sec=>{
    (sec.items||[]).forEach(it=>{
      const old = oldById[it.id];
      const oldReceived = old ? (parseFloat(old.received)||0) : 0;
      const newReceived = parseFloat(it.received) || 0;
      const masterId = it.masterId || (old && old.masterId) || null;
      if(masterId){
        const delta = newReceived - oldReceived;
        if(delta !== 0) deltaByMasterId[masterId] = (deltaByMasterId[masterId]||0) + delta;
      }
      delete oldById[it.id];
    });
  });
  // remaining entries in oldById were deleted rows -> refund their received qty back to stock
  Object.values(oldById).forEach(old=>{
    if(old.masterId){
      const oldReceived = parseFloat(old.received) || 0;
      if(oldReceived !== 0) deltaByMasterId[old.masterId] = (deltaByMasterId[old.masterId]||0) - oldReceived;
    }
  });
  let changed = false;
  Object.keys(deltaByMasterId).forEach(masterId=>{
    const invItem = state.inventory.find(i=>i.id === masterId);
    if(invItem){
      invItem.stock = (parseFloat(invItem.stock)||0) - deltaByMasterId[masterId];
      changed = true;
    }
  });
  return changed;
}

async function logHistorySnapshot(){
  let history = await settingsGet(HISTORY_KEY);
  if(!Array.isArray(history)) history = [];
  history.unshift({
    time: nowTimeLabel(),
    chef: state.chef,
    date: state.date,
    sections: JSON.parse(JSON.stringify(state.sections))
  });
  if(history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  await settingsSet(HISTORY_KEY, history);
}

async function saveSheet(showMsg){
  const payload = { chef: state.chef, date: state.date, sections: state.sections };
  const invChanged = applyInventoryDeltas();
  const ok = await settingsSet(SHEET_KEY, payload);
  if(ok){
    await logHistorySnapshot();
    lastSavedSections = JSON.parse(JSON.stringify(state.sections));
    if(invChanged) await saveInventory();
  }
  if(showMsg){
    state.message = ok ? { type:'success', text:'تم الحفظ بنجاح (وتحديث الجرد تلقائيًا)' } : { type:'error', text:'حدث خطأ أثناء الحفظ' };
    render();
    setTimeout(()=>{ state.message = null; render(); }, 2500);
  }
}

async function loadHistory(){
  historyList = await settingsGet(HISTORY_KEY) || [];
  render();
}

function addSection(){
  state.sections.push({ id: uid(), title: 'قسم جديد', items: [] });
  render();
}
function removeSection(sectionId){
  if(!confirm('حذف هذا القسم بالكامل؟')) return;
  state.sections = state.sections.filter(s => s.id !== sectionId);
  render();
}
function addItem(sectionId){
  const section = state.sections.find(s => s.id === sectionId);
  if(!section) return;
  section.items.push(emptyItem());
  render();
}
function removeItem(sectionId, itemId){
  const section = state.sections.find(s => s.id === sectionId);
  if(!section) return;
  section.items = section.items.filter(i => i.id !== itemId);
  render();
}

async function addInventoryItem(){
  const name = prompt('اسم الصنف الجديد بالجرد:');
  if(!name || !name.trim()) return;
  if(state.inventory.some(i=>i.name.trim() === name.trim())){
    alert('هذا الصنف موجود بالجرد أصلاً.');
    return;
  }
  const unit = prompt('الوحدة (كيلو / غرام / لتر / عدد):', 'كيلو') || 'كيلو';
  const stockStr = prompt('الكمية الحالية المتوفرة بالمخزن:', '0') || '0';
  const stock = parseFloat(stockStr) || 0;
  state.inventory.push({ id: uid(), name: name.trim(), unit: unit.trim(), stock });
  await saveInventory();
  render();
}
async function receiveStock(itemId){
  const item = state.inventory.find(i=>i.id===itemId);
  if(!item) return;
  const qtyStr = prompt(`كمية "${item.name}" الجديدة المستلمة (بتضاف على الرصيد الحالي: ${item.stock}):`, '0');
  if(qtyStr === null) return;
  const qty = parseFloat(qtyStr) || 0;
  if(qty === 0) return;
  item.stock = (parseFloat(item.stock)||0) + qty;
  await saveInventory();
  render();
}
async function removeInventoryItem(itemId){
  if(!confirm('حذف هذا الصنف من الجرد نهائيًا؟')) return;
  state.inventory = state.inventory.filter(i=>i.id!==itemId);
  await saveInventory();
  render();
}
function resetQuantitiesForToday(){
  if(!confirm('هذا يصفّر الكميات (المطلوبة/المستلمة/المتبقي) لكل الأصناف ويحدّث التاريخ لليوم، بدون حذف أي صنف ولا التأثير على أرصدة الجرد. تأكد أنك حفظت أرقام اليوم قبل المتابعة. متابعة؟')) return;
  state.date = todayISO();
  state.sections.forEach(section=>{
    section.items.forEach(item=>{
      item.requested = 0;
      item.received = 0;
      item.remaining = 0;
    });
  });
  lastSavedSections = JSON.parse(JSON.stringify(state.sections));
  render();
}

function buildWhatsappText(){
  const lines = [];
  lines.push('إذن صرف من المخزن - تنورك');
  lines.push('التاريخ: ' + isoToDisplay(state.date) + ' (' + weekdayName(state.date) + ')');
  if(state.chef) lines.push('الشيف: ' + state.chef);
  lines.push('');
  state.sections.forEach(section=>{
    lines.push('== ' + section.title + ' ==');
    if(section.items.length === 0){
      lines.push('(لا توجد أصناف)');
    } else {
      section.items.forEach(item=>{
        lines.push(`- ${item.name || '(بدون اسم)'} | الوحدة: ${item.unit} | مطلوبة: ${item.requested} | مستلمة: ${item.received} | المتبقي: ${item.remaining} | أمين المخزن: ${item.storekeeper||'-'} | المستلم: ${item.receiver||'-'}`);
      });
    }
    lines.push('');
  });
  return lines.join('\n');
}

function sendWhatsappText(){
  const text = buildWhatsappText();
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

function canvasToPdfBlob(canvas){
  const { jsPDF } = window.jspdf;
  const imgWidth = canvas.width;
  const imgHeight = canvas.height;
  const pdfWidthMM = 190;
  const pxToMM = pdfWidthMM / imgWidth;
  const pdfHeightMM = imgHeight * pxToMM;
  const pageHeightMM = 277;
  const marginX = 10, marginY = 10;
  const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

  if(pdfHeightMM <= pageHeightMM){
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', marginX, marginY, pdfWidthMM, pdfHeightMM);
  } else {
    const pageHeightPx = Math.floor(pageHeightMM / pxToMM);
    let renderedHeight = 0;
    let first = true;
    while(renderedHeight < imgHeight){
      const sliceHeight = Math.min(pageHeightPx, imgHeight - renderedHeight);
      const pageCanvas = document.createElement('canvas');
      pageCanvas.width = imgWidth;
      pageCanvas.height = sliceHeight;
      const ctx = pageCanvas.getContext('2d');
      ctx.drawImage(canvas, 0, renderedHeight, imgWidth, sliceHeight, 0, 0, imgWidth, sliceHeight);
      const sliceHeightMM = sliceHeight * pxToMM;
      if(!first) pdf.addPage();
      pdf.addImage(pageCanvas.toDataURL('image/png'), 'PNG', marginX, marginY, pdfWidthMM, sliceHeightMM);
      renderedHeight += sliceHeight;
      first = false;
    }
  }
  return pdf.output('blob');
}

async function shareOrDownloadPdf(canvas, filenameBase){
  if(typeof window.jspdf === 'undefined'){
    alert('تعذّر تحميل أداة إنشاء PDF.');
    return;
  }
  let pdfBlob;
  try{
    pdfBlob = canvasToPdfBlob(canvas);
  }catch(e){
    alert('تعذّر إنشاء ملف PDF.');
    return;
  }
  const fname = filenameBase + '.pdf';
  const file = new File([pdfBlob], fname, { type:'application/pdf' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file], title: filenameBase });
      return;
    }catch(e){ /* cancelled, fall through to download */ }
  }
  const url = URL.createObjectURL(pdfBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  alert('تم حفظ ملف PDF في جهازك. افتحه وشاركه على واتساب.');
}

async function captureSectionAndShare(sectionId){
  const section = state.sections.find(s=>s.id===sectionId);
  if(!section) return;
  if(typeof html2canvas === 'undefined'){
    alert('تعذّر تحميل أداة تصوير الكشف.');
    return;
  }
  const itemsRows = section.items.map(it=>`
    <tr>
      <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.name||''}</td>
      <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.unit}</td>
      <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.requested}</td>
      <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.received}</td>
      <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.remaining}</td>
      <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.storekeeper||''}</td>
      <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.receiver||''}</td>
    </tr>
  `).join('') || `<tr><td colspan="7" style="border:1.5px solid #000;padding:10px;text-align:center;color:#555;">لا توجد أصناف</td></tr>`;

  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-9999px';
  wrapper.style.top = '0';
  wrapper.style.width = '680px';
  wrapper.style.background = '#ffffff';
  wrapper.style.padding = '18px';
  wrapper.style.fontFamily = "'Segoe UI', Tahoma, Arial, sans-serif";
  wrapper.style.direction = 'rtl';
  wrapper.style.color = '#000';
  wrapper.innerHTML = `
    <h1 style="text-align:center;font-size:20px;margin:0 0 4px;">إذن صرف من المخزن</h1>
    <p style="text-align:center;color:#555;font-size:13px;margin:0 0 12px;">مطعم تنورك</p>
    <div style="text-align:center;font-weight:800;font-size:15px;margin-bottom:14px;line-height:1.9;">
      القسم: ${section.title}<br>
      التاريخ: ${isoToDisplay(state.date)} (${weekdayName(state.date)})
      ${state.chef ? '<br>الشيف: '+state.chef : ''}
    </div>
    <table style="width:100%;border-collapse:collapse;min-width:0;table-layout:fixed;">
      <thead>
        <tr style="background:#eee;">
          <th style="border:1.5px solid #000;padding:8px 6px;font-size:12.5px;">اسم الصنف</th>
          <th style="border:1.5px solid #000;padding:8px 6px;font-size:12.5px;">الوحدة</th>
          <th style="border:1.5px solid #000;padding:8px 6px;font-size:12.5px;">الكمية المطلوبة</th>
          <th style="border:1.5px solid #000;padding:8px 6px;font-size:12.5px;">الكمية المستلمة</th>
          <th style="border:1.5px solid #000;padding:8px 6px;font-size:12.5px;">المتبقي</th>
          <th style="border:1.5px solid #000;padding:8px 6px;font-size:12.5px;">أمين المخزن</th>
          <th style="border:1.5px solid #000;padding:8px 6px;font-size:12.5px;">المستلم</th>
        </tr>
      </thead>
      <tbody>${itemsRows}</tbody>
    </table>
  `;
  document.body.appendChild(wrapper);
  let canvas;
  try{
    canvas = await html2canvas(wrapper, {
      backgroundColor:'#ffffff', scale:2, useCORS:true,
      windowWidth: wrapper.scrollWidth, windowHeight: wrapper.scrollHeight,
      width: wrapper.scrollWidth, height: wrapper.scrollHeight
    });
  }catch(e){
    document.body.removeChild(wrapper);
    alert('تعذّر إنشاء صورة القسم.');
    return;
  }
  document.body.removeChild(wrapper);
  await shareOrDownloadPdf(canvas, `اذن-صرف-${section.title}`);
}

    return;
  }
  const sectionsWithData = state.sections
    .map(sec => ({ title: sec.title, items: sec.items.filter(it => (it.name||'').trim() !== '') }))
    .filter(sec => sec.items.length > 0);

  if(sectionsWithData.length === 0){
    alert('لا توجد أصناف مسجلة بعد لإنشاء تقرير (كل الخانات لسا فاضية).');
    return;
  }

  const sectionsHtml = sectionsWithData.map(sec=>{
    const rows = sec.items.map(it=>`
      <tr>
        <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.name}</td>
        <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.unit}</td>
        <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.requested}</td>
        <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.received}</td>
        <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.remaining}</td>
        <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.storekeeper||''}</td>
        <td style="border:1.5px solid #000;padding:6px;text-align:center;">${it.receiver||''}</td>
      </tr>
    `).join('');
    return `
      <div style="margin-bottom:16px;">
        <div style="background:#000;color:#fff;font-weight:800;padding:8px 10px;font-size:15px;">${sec.title}</div>
        <table style="width:100%;border-collapse:collapse;min-width:0;table-layout:fixed;">
          <thead>
            <tr style="background:#eee;">
              <th style="border:1.5px solid #000;padding:6px;font-size:12px;">اسم الصنف</th>
              <th style="border:1.5px solid #000;padding:6px;font-size:12px;">الوحدة</th>
              <th style="border:1.5px solid #000;padding:6px;font-size:12px;">المطلوبة</th>
              <th style="border:1.5px solid #000;padding:6px;font-size:12px;">المستلمة</th>
              <th style="border:1.5px solid #000;padding:6px;font-size:12px;">المتبقي</th>
              <th style="border:1.5px solid #000;padding:6px;font-size:12px;">أمين المخزن</th>
              <th style="border:1.5px solid #000;padding:6px;font-size:12px;">المستلم</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }).join('');

  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-9999px';
  wrapper.style.top = '0';
  wrapper.style.width = '700px';
  wrapper.style.background = '#ffffff';
  wrapper.style.padding = '18px';
  wrapper.style.fontFamily = "'Segoe UI', Tahoma, Arial, sans-serif";
  wrapper.style.direction = 'rtl';
  wrapper.style.color = '#000';
  wrapper.innerHTML = `
    <h1 style="text-align:center;font-size:20px;margin:0 0 4px;">تقرير التفاصيل المسجلة</h1>
    <p style="text-align:center;color:#555;font-size:13px;margin:0 0 10px;">مطعم تنورك</p>
    <div style="text-align:center;font-weight:800;font-size:14px;margin-bottom:14px;">
      التاريخ: ${isoToDisplay(state.date)} (${weekdayName(state.date)})
      ${state.chef ? ' | الشيف: '+state.chef : ''}
    </div>
    ${sectionsHtml}
  `;
  document.body.appendChild(wrapper);
  let canvas;
  try{
    canvas = await html2canvas(wrapper, {
      backgroundColor:'#ffffff', scale:2, useCORS:true,
      windowWidth: wrapper.scrollWidth, windowHeight: wrapper.scrollHeight,
      width: wrapper.scrollWidth, height: wrapper.scrollHeight
    });
  }catch(e){
    document.body.removeChild(wrapper);
    alert('تعذّر إنشاء التقرير.');
    return;
  }
  document.body.removeChild(wrapper);
  await shareOrDownloadPdf(canvas, 'تقرير-تنورك-' + state.date);
}

async function captureAndShare(){
  if(typeof html2canvas === 'undefined'){
    alert('تعذّر تحميل أداة تصوير الكشف. سيتم إرسال نسخة نصية بدلاً من الصورة.');
    sendWhatsappText();
    return;
  }
  const target = document.getElementById('capture-area');
  let canvas;
  try{
    canvas = await html2canvas(target, {
      backgroundColor: '#ffffff', scale: 2, useCORS: true,
      windowWidth: target.scrollWidth, windowHeight: target.scrollHeight,
      width: target.scrollWidth, height: target.scrollHeight
    });
  }catch(e){
    alert('تعذّر إنشاء صورة الكشف. سيتم إرسال نسخة نصية بدلاً من ذلك.');
    sendWhatsappText();
    return;
  }
  await shareOrDownloadPdf(canvas, 'اذن-صرف-تنورك-' + state.date);
}

function messageBox(){
  if(!state.message) return '';
  const cls = state.message.type === 'error' ? 'msg-error' : 'msg-success';
  return `<div class="msg ${cls}">${state.message.text}</div>`;
}

function unitOptions(selected){
  return ['كيلو','غرام','لتر','عدد'].map(u=>`<option value="${u}" ${u===selected?'selected':''}>${u}</option>`).join('');
}

function App(){
  const app = document.getElementById('app');
  app.dataset.rendered = '1';
  if(state.loading){
    app.innerHTML = '<div style="text-align:center;padding:40px 0;">جارِ التحميل...</div>';
    return;
  }
  app.innerHTML = `
    <div id="capture-area">
      <h1>إذن صرف من المخزن</h1>
      <p class="sub">مطعم تنورك</p>
      <div class="top-row" style="font-size:14px;font-weight:700;">
        <span>التاريخ: ${isoToDisplay(state.date)}</span>
        <span>&nbsp;|&nbsp;</span>
        <span>اليوم: ${weekdayName(state.date)}</span>
        ${state.chef ? `<span>&nbsp;|&nbsp;</span><span>الشيف: ${state.chef}</span>` : ''}
      </div>
      <div id="sections-holder"></div>
    </div>
    ${messageBox()}
    <div class="top-row no-print">
      <label>التاريخ:</label>
      <input type="date" id="date-input" value="${state.date}">
      <label>اسم الشيف:</label>
      <input type="text" id="chef-input" placeholder="اكتب اسم الشيف" value="${state.chef.replace(/"/g,'&quot;')}">
    </div>
    <button class="add-section-btn no-print" id="add-section-btn">+ إضافة قسم جديد</button>
    <div class="actions-bar no-print">
      <button class="big primary" id="save-btn">حفظ التعديلات</button>
      <button class="big whatsapp" id="wa-btn">📲 إرسال الكشف كامل</button>
      <button class="big" id="print-btn">🖨️ طباعة</button>
      <button class="big" id="history-btn">📜 السجل التاريخي</button>
      <button class="big" id="reset-btn">🔄 تصفير الكميات لليوم</button>
      <button class="big" id="report-btn">📄 تقرير التفاصيل المسجلة</button>
      <button class="big" id="inventory-btn" style="background:#0a6b3f;color:#fff;border-color:#0a6b3f;">📦 الجرد</button>
    </div>
    <div id="inventory-panel" class="no-print"></div>
    <div id="history-panel"></div>
    <datalist id="master-items-list">
      ${state.inventory.map(i=>`<option value="${i.name.replace(/"/g,'&quot;')}">`).join('')}
    </datalist>
  `;

  document.getElementById('date-input').oninput = (e)=>{ state.date = e.target.value; render(); };
  document.getElementById('chef-input').oninput = (e)=>{ state.chef = e.target.value; };
  document.getElementById('add-section-btn').onclick = addSection;
  document.getElementById('save-btn').onclick = ()=> saveSheet(true);
  document.getElementById('wa-btn').onclick = captureAndShare;
  document.getElementById('print-btn').onclick = ()=> window.print();
  document.getElementById('history-btn').onclick = ()=>{
    historyOpen = !historyOpen;
    if(historyOpen && historyList === null) loadHistory();
    else render();
  };
  document.getElementById('reset-btn').onclick = resetQuantitiesForToday;
  document.getElementById('report-btn').onclick = captureRecordedReport;
  document.getElementById('inventory-btn').onclick = ()=>{ inventoryOpen = !inventoryOpen; render(); };

  const inventoryPanel = document.getElementById('inventory-panel');
  if(inventoryOpen){
    const rows = state.inventory.length === 0
      ? `<tr><td colspan="4" class="empty-note">لا توجد أصناف بالجرد بعد</td></tr>`
      : state.inventory.map(i=>`
          <tr>
            <td>${i.name}</td>
            <td>${i.unit}</td>
            <td style="font-weight:800;">${i.stock}</td>
            <td class="row-actions">
              <button data-receive-stock="${i.id}">📦 استلام</button>
              <button class="danger" data-remove-inv="${i.id}">حذف</button>
            </td>
          </tr>
        `).join('');
    inventoryPanel.innerHTML = `
      <div class="section" style="margin-bottom:18px;">
        <div class="section-header" style="background:#0a6b3f;">
          <span style="flex:1;font-size:15px;font-weight:800;">📦 الجرد الحالي بالمخزن</span>
          <button class="icon-btn" id="add-inv-btn" style="background:#fff;color:#0a6b3f;">+ إضافة صنف جديد</button>
        </div>
        <table>
          <thead><tr><th>اسم الصنف</th><th>الوحدة</th><th>الرصيد الحالي</th><th>إجراء</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
    document.getElementById('add-inv-btn').onclick = addInventoryItem;
    inventoryPanel.querySelectorAll('[data-receive-stock]').forEach(btn=>{
      btn.onclick = ()=> receiveStock(btn.dataset.receiveStock);
    });
    inventoryPanel.querySelectorAll('[data-remove-inv]').forEach(btn=>{
      btn.onclick = ()=> removeInventoryItem(btn.dataset.removeInv);
    });
  } else {
    inventoryPanel.innerHTML = '';
  }

  const historyPanel = document.getElementById('history-panel');
  if(historyOpen){
    if(historyList === null){
      historyPanel.innerHTML = '<div style="text-align:center;padding:20px;">جارِ تحميل السجل...</div>';
    } else if(historyList.length === 0){
      historyPanel.innerHTML = '<div class="empty-note">لا يوجد سجل محفوظ بعد</div>';
    } else {
      historyPanel.innerHTML = historyList.map(entry=>{
        const sectionsHtml = entry.sections.map(sec=>{
          if(!sec.items || sec.items.length===0) return '';
          const rows = sec.items.map(it=>`
            <tr>
              <td>${it.name}</td>
              <td>${it.unit}</td>
              <td>${it.requested}</td>
              <td>${it.received}</td>
              <td>${it.remaining}</td>
              <td>${it.storekeeper||''}</td>
              <td>${it.receiver||''}</td>
            </tr>
          `).join('');
          return `
            <div style="margin-top:8px;">
              <div style="font-weight:800;background:#eee;padding:6px 10px;border:1px solid #000;">${sec.title}</div>
              <table>
                <thead><tr><th>الصنف</th><th>الوحدة</th><th>مطلوبة</th><th>مستلمة</th><th>المتبقي</th><th>أمين المخزن</th><th>المستلم</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          `;
        }).join('');
        return `
          <div class="section" style="margin-bottom:18px;">
            <div class="section-header" style="background:#333;">
              <span style="flex:1;font-size:14px;font-weight:800;">🕒 ${entry.time} — الشيف: ${entry.chef || '-'} — التاريخ: ${isoToDisplay(entry.date)}</span>
            </div>
            ${sectionsHtml || '<div class="empty-note">لا توجد أصناف مسجلة بهذه النسخة</div>'}
          </div>
        `;
      }).join('');
    }
  } else {
    historyPanel.innerHTML = '';
  }

  const holder = document.getElementById('sections-holder');
  state.sections.forEach(section=>{
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `
      <div class="section-header">
        <input type="text" class="section-title-input no-print" data-id="${section.id}" value="${section.title.replace(/"/g,'&quot;')}" placeholder="عنوان القسم">
        <span class="section-title-print" style="display:none;flex:1;font-size:17px;font-weight:800;">${section.title}</span>
        <button class="icon-btn no-print" data-share-section="${section.id}" style="background:#25D366;border-color:#25D366;color:#fff;">📲 إرسال هذا القسم</button>
        <button class="icon-btn danger no-print" data-remove-section="${section.id}">حذف القسم</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>اسم الصنف</th>
            <th>الوحدة</th>
            <th>الكمية المطلوبة</th>
            <th>الكمية المستلمة</th>
            <th>المتبقي</th>
            <th>أمين المخزن</th>
            <th>المستلم</th>
            <th class="no-print">إجراء</th>
          </tr>
        </thead>
        <tbody data-items-body="${section.id}"></tbody>
      </table>
      <table class="no-print"><tbody>
        <tr class="add-item-row"><td colspan="8"><button data-add-item="${section.id}">+ إضافة صنف</button></td></tr>
      </tbody></table>
    `;
    holder.appendChild(sec);

    const tbody = sec.querySelector(`[data-items-body="${section.id}"]`);
    if(section.items.length === 0){
      tbody.innerHTML = `<tr><td colspan="8" class="empty-note">لا توجد أصناف بعد</td></tr>`;
    } else {
      section.items.forEach(item=>{
        const tr = document.createElement('tr');
        const linkedBadge = item.masterId ? ' style="border-color:#0a6b3f;background:#eafaf1;"' : '';
        tr.innerHTML = `
          <td><input type="text" class="name-input" list="master-items-list" data-field="name"${linkedBadge} value="${(item.name||'').replace(/"/g,'&quot;')}" placeholder="اسم الصنف (من الجرد لو موجود)"></td>
          <td><select data-field="unit">${unitOptions(item.unit)}</select></td>
          <td><input type="number" step="any" data-field="requested" value="${item.requested}"></td>
          <td><input type="number" step="any" data-field="received" value="${item.received}"></td>
          <td><input type="number" step="any" data-field="remaining" value="${item.remaining}"></td>
          <td><input type="text" data-field="storekeeper" value="${(item.storekeeper||'').replace(/"/g,'&quot;')}" placeholder="أمين المخزن"></td>
          <td><input type="text" data-field="receiver" value="${(item.receiver||'').replace(/"/g,'&quot;')}" placeholder="المستلم"></td>
          <td class="row-actions no-print"><button class="danger" data-remove-item="${section.id}|${item.id}">حذف</button></td>
        `;
        tbody.appendChild(tr);
        tr.querySelectorAll('[data-field]').forEach(inputEl=>{
          inputEl.oninput = ()=>{
            const field = inputEl.dataset.field;
            let val = inputEl.value;
            if(field==='requested' || field==='received' || field==='remaining') val = parseFloat(val) || 0;
            item[field] = val;
            if(field === 'name'){
              const match = state.inventory.find(inv => inv.name.trim() === (val||'').trim() && (val||'').trim() !== '');
              if(match){
                item.masterId = match.id;
                item.unit = match.unit;
                render();
              } else {
                item.masterId = null;
              }
            }
          };
        });
      });
    }
  });

  holder.querySelectorAll('.section-title-input').forEach(inputEl=>{
    inputEl.oninput = ()=>{
      const section = state.sections.find(s=>s.id===inputEl.dataset.id);
      if(section) section.title = inputEl.value;
      const printSpan = inputEl.parentElement.querySelector('.section-title-print');
      if(printSpan) printSpan.textContent = inputEl.value;
    };
  });
  holder.querySelectorAll('[data-remove-section]').forEach(btn=>{
    btn.onclick = ()=> removeSection(btn.dataset.removeSection);
  });
  holder.querySelectorAll('[data-share-section]').forEach(btn=>{
    btn.onclick = ()=> captureSectionAndShare(btn.dataset.shareSection);
  });
  holder.querySelectorAll('[data-add-item]').forEach(btn=>{
    btn.onclick = ()=> addItem(btn.dataset.addItem);
  });
  holder.querySelectorAll('[data-remove-item]').forEach(btn=>{
    btn.onclick = ()=>{
      const [sectionId, itemId] = btn.dataset.removeItem.split('|');
      removeItem(sectionId, itemId);
    };
  });
}

function render(){ App(); }

init().catch(function(err){ showFatalError('Init failed: ' + (err && err.message ? err.message : err)); });
</script>
</body>
</html>
